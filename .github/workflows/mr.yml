name: CI MR Workflow

on:
  push:
    branches-ignore:
      - main  # Ignore main branch
  pull_request: # Triggers for pull requests to any branch

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm' # Caches dependencies for faster installs

    - name: Install dependencies (only for package/)
      run: cd package && npm ci --install-links
      env:
        NODE_ENV: development

    - name: Build Package
      run: cd package && npm run build
      env:
        NODE_ENV: production

    - name: Run Tests
      run: cd package && npm test
